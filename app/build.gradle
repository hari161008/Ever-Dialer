plugins {
    id 'com.android.application' version '9.1.1'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.21'
    id 'com.google.devtools.ksp' version '2.3.9'
}

android {
    namespace = 'com.coolappstore.everdialer.by.svhp'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.coolappstore.everdialer.by.svhp"
        minSdk = 26
        targetSdk = 35
        versionCode = 17
        versionName = "14.1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile = file("keystore.jks")
            storePassword = "12345678"
            keyAlias = "key0"
            keyPassword = "12345678"
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            debuggable = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // التصليح هنا: الـ Debug يستعمل المفتاح التلقائي (Default)
            // هكا الـ GitHub Actions يجم يخرجلك APK حتى من غير Keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)

            freeCompilerArgs.addAll(
                "-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi",
                "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api"
            )
        }
    }

    flavorDimensions += "distribution"
    productFlavors {
        github {
            dimension "distribution"
            applicationId "com.coolappstore.everdialer.by.svhp"
        }
        fdroid {
            dimension "distribution"
            applicationId "com.everlasting.projects.by.svhp.freedroid"
        }
        play {
            dimension "distribution"
            applicationId "com.everlasting.projects.by.svhp.play"
            targetSdk = 36
            versionCode = 19
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }
}

dependencies {
    githubImplementation project(':recorder')
    githubImplementation project(':networkswitch')
    fdroidImplementation project(':networkswitch')

    implementation platform('androidx.compose:compose-bom:2025.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.graphics:graphics-shapes:1.0.1'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    implementation 'androidx.navigation:navigation-compose:2.8.5'

    // Biometrics
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    implementation 'io.github.raamcosta.compose-destinations:core:2.1.0'
    ksp 'io.github.raamcosta.compose-destinations:ksp:2.1.0'

    implementation "com.google.accompanist:accompanist-permissions:0.37.3"

    implementation platform("io.insert-koin:koin-bom:4.1.1")
    implementation "io.insert-koin:koin-android"
    implementation "io.insert-koin:koin-androidx-compose"

    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation 'com.google.zxing:core:3.5.4'


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}

tasks.configureEach { task ->
    if (task.name == "bundlePlayRelease") {
        task.doLast {
            def aabFile = file("${layout.buildDirectory.get()}/outputs/bundle/playRelease/app-play-release.aab")
            if (aabFile.exists()) {
                if (project.hasProperty('android.injected.output.dir')) {
                    def destDir = file(project.property('android.injected.output.dir'))
                    destDir.mkdirs()
                    copy {
                        from aabFile
                        into destDir
                    }
                    def flavorDir = new File(destDir, "playRelease")
                    flavorDir.mkdirs()
                    copy {
                        from aabFile
                        into flavorDir
                    }
                }
                def rootReleaseDir = file("${rootDir}/release")
                rootReleaseDir.mkdirs()
                copy {
                    from aabFile
                    into rootReleaseDir
                }
                // Move instead of copy: remove original from build cache
                aabFile.delete()
                file("${layout.buildDirectory.get()}/outputs/bundle/playRelease").deleteDir()
            }
        }
    }
}
